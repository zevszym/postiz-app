# Obraz Postiza CRAFTBE pod arm64 (rubusta-app-1s, Hetzner aarch64).
# Gałęzie: craftbe-artemis (kod z artemisa) i craftbe-v2.25.3 (oryginał v2.25.3 + postGetTool i postEditTool).
name: craftbe-arm64
on:
  push:
    branches: [craftbe-artemis, craftbe-v2.25.3]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Budowa i wysyłka
        run: |
          WERSJA=craftbe-${GITHUB_SHA::8}
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=$WERSJA \
            -t ghcr.io/zevszym/postiz-app:$WERSJA \
            -t ghcr.io/zevszym/postiz-app:${GITHUB_REF_NAME} \
            --push .
