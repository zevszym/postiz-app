# Obraz Postiza CRAFTBE pod arm64 (rubusta-app-1s, Hetzner aarch64).
# Gałąź craftbe-artemis = kod z obrazu, który działał na artemisie (msymaniuksztis/postiz-app:5224a179,
# zbudowany 2026-03-24 z niewypchniętych zmian) — wyciągnięty z kontenera 2026-11-08.
name: craftbe-arm64
on:
  push:
    branches: [craftbe-artemis]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Budowa i wysyłka
        run: |
          WERSJA=craftbe-${GITHUB_SHA::8}
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=$WERSJA \
            -t ghcr.io/zevszym/postiz-app:$WERSJA \
            -t ghcr.io/zevszym/postiz-app:craftbe-arm64 \
            --push .
